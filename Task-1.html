<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: black;">
    <table border="2" style="color: black; border-color:white;" align="center" cellpadding="25">
        
        <tr>
            <th style="color: white;" colspan="2" >Registration Form</th>
        </tr>
        
        <tr>
            <td style="color: white;" ><label for="name" >Name:</label></td>
            <td style="color: white;"><input type="text" id="name" name="name" ></td>
        </tr>

        <tr>
            <td style="color: white;"><label for="password" >password:</label></td>
            <td style="color: white;"><input type="password"></td>
        </tr>

        <tr>
            <td style="color: white;"><label for="Address" >Address:</label></td>
            <td style="color: white;">
                <input type="text" placeholder="" size="20" style="height: 40px;">
                
        </tr>

        <tr>
            <td style="color: white;"><label for="Gender" >Gender:</label></td>
            <td style="color: white;"><input type="radio">Male
            <input type="radio">Female</td>
        </tr>

        <tr>
            <td style="color: white;"><label for="Hobby" >Hobby:</label></td>
            <td style="color: white;">
            <input type="checkbox">H1
            <input type="checkbox">H2
            <input type="checkbox">H3</td>
        </tr>

         <tr>
            <td style="color: white;"><label for="City" >City:</label></td>
            <td style="color: white;">
                <label for="--Select--" ></label>
                <select name="Select City">
                <option value="--Select--"></option>
                <option value="Surat">Surat</option>
                <option value="Ahemdabad">Ahemdabad</option>
                <option value="Morbi">Morbi</option>
            </select></td>
        </tr>

        <tr>
            <td style="color: white;"><label for="upload" >Upload Photo:</label></td>
            <td style="color: white;"><input type="file"></td>
        </tr>

        <tr>
            <td style="color: white;"></td>
            <td style="color: white;">
                <input type="submit">
            <input type="button" value="Clear">
            <input type="button" value="Login"></td>
        </tr>

        
    </table>
</body>
</html>
